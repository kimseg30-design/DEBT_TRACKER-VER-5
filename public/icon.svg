<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="8"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="170" fill="#10b981" fill-opacity="0.08" filter="url(#glow)"/>
  
  <!-- Wallet Body Shape -->
  <g transform="translate(106, 126)">
    <!-- Main Backing -->
    <rect x="10" y="30" width="280" height="200" rx="36" fill="#18181b" stroke="url(#emeraldGrad)" stroke-width="12"/>
    
    <!-- Top Flap / Pocket -->
    <path d="M 10 90 L 290 90" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Card / Cash peeking -->
    <rect x="60" y="0" width="180" height="50" rx="14" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="6"/>
    <circle cx="150" cy="25" r="10" fill="#34d399"/>
    
    <!-- Clasp / Lock with Peso Symbol -->
    <rect x="200" y="105" width="85" height="55" rx="18" fill="url(#emeraldGrad)" filter="url(#glow)"/>
    <circle cx="242" cy="132" r="10" fill="#09090b"/>
    
    <!-- Currency sign (₱) decorative line -->
    <path d="M 90 140 L 150 140 M 90 155 L 140 155" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
